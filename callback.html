<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tesla connected</title>
<style>body{font-family:system-ui,sans-serif;max-width:560px;margin:40px auto;padding:0 16px;line-height:1.5}textarea{width:100%;height:110px;font-size:14px;box-sizing:border-box}button{margin-top:8px;padding:10px 16px;font-size:16px}</style></head>
<body><h2 id="h">Almost done</h2><p id="m"></p><textarea id="c" readonly></textarea><br><button onclick="cp()">Copy code</button>
<script>
var q=new URLSearchParams(location.search);var code=q.get('code');var err=q.get('error');
if(code){document.getElementById('m').textContent='Copy this code and paste it into the secure form in your Volt chat within a few minutes. It only works once.';document.getElementById('c').value=code;}
else{document.getElementById('h').textContent='Sign-in did not complete';document.getElementById('m').textContent='Tesla returned: '+(err||'no code')+' '+(q.get('error_description')||'');document.getElementById('c').style.display='none';}
function cp(){var t=document.getElementById('c');t.select();navigator.clipboard&&navigator.clipboard.writeText(t.value);}
</script></body></html>
